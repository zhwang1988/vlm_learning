# =============================================================================
# docker-compose.yml —— W7 Shopify App / W6 Agent 的本地一键环境
#
#   docker compose up -d          # 起 PostgreSQL + 应用
#   docker compose logs -f app    # 看应用日志
#   docker compose down           # 停掉（数据卷保留）
#
# 设计：
#   - PostgreSQL 用官方 pgvector 镜像（自带向量检索扩展，不用自己编译）
#   - app 用本地 Dockerfile 构建（见 ./Dockerfile）
#   - 数据库数据落在命名卷里，down 不丢，down -v 才丢
#
# 训练环境不在这里面 —— 训练在云 GPU 上跑（见 docs/13-hardware-and-cost.md），
# 这套 compose 只管「应用侧」：数据库 + API 服务。
# =============================================================================

services:

  # ------------------------------------------------------------------ 数据库
  db:
    image: pgvector/pgvector:pg16          # 官方 Postgres 16 + pgvector 扩展
    container_name: mmlab-db
    environment:
      POSTGRES_USER: mmlab
      POSTGRES_PASSWORD: mmlab            # 本地开发用，生产换强密码/用 secrets
      POSTGRES_DB: mmlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmlab -d mmlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------- 应用（API）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmlab-app
    environment:
      # 数据库指向同 compose 网络里的 db 服务
      DATABASE_URL: postgresql://mmlab:mmlab@db:5432/mmlab
      PGVECTOR_ENABLED: "true"
      # 模型服务：本地训练时指向 vLLM（宿主机地址），或填 API 服务的 URL
      VLLM_BASE: ${VLLM_BASE:-http://host.docker.internal:8000/v1}
      SERVED_MODEL: ${SERVED_MODEL:-cx-vlm}
      AGENT_MODEL: ${AGENT_MODEL:-cx-vlm}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PII_REDACTION: "true"
      DEBUG_PROMPT: "false"
    ports:
      - "8001:8001"                        # 应用对外端口
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 上也能访问宿主机的 vLLM
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: mmlab-pgdata                     # 命名卷：down 不删，down -v 才删